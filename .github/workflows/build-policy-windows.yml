name: Build Ace Policy Studio (Windows)

# Builds Ace Policy Studio into a portable Windows .exe on a real Windows
# runner — after running the renderer E2E suite and an Electron smoke test
# (library seeding + a production printToPDF) — and publishes it as both a
# workflow artifact and a stable GitHub Release download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ace-policy-studio/**"
      - ".github/workflows/build-policy-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ace-policy-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ace-policy-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Renderer E2E (Playwright)
        run: |
          npx playwright install chromium
          npx playwright test tests/app.spec.ts

      - name: Electron smoke test (seeding + printToPDF)
        run: node scripts/electron-smoke.mjs

      # Publishes a versioned release (tag v<version>) with the one-click
      # installer + latest.yml so installed apps auto-update on launch.
      # If the version tag already exists, the build still runs as a check
      # but nothing is published — bump "version" in package.json to ship.
      - name: Package & publish installer (auto-update feed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A release only counts if it's COMPLETE — latest.yml is the
          # auto-update feed; a crashed publish can leave a partial release
          # behind, and skipping because of one would ship a broken feed.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.yml'; then
            echo "::notice::Release v$VERSION already published — packaging without publishing. Bump ace-policy-studio/package.json version to ship an update."
            npx electron-builder --win --publish never
          else
            # Remove any partial release/tag from a failed publish, then
            # tag this commit — GitHub refuses to create a *published*
            # release on a tag that doesn't exist.
            gh release delete "v$VERSION" --yes --cleanup-tag || true
            git push origin ":refs/tags/v$VERSION" || true
            git tag -f "v$VERSION" "$GITHUB_SHA"
            git push origin -f "v$VERSION"
            # Pre-create the release: electron-builder uploads its files on
            # parallel threads, and if the release doesn't exist yet both
            # threads race to create it — GitHub can end up with TWO
            # releases on one tag, splitting the assets. With the release
            # already there, the threads just upload into it.
            gh release create "v$VERSION" \
              --title "$VERSION" \
              --notes "Ace Policy Studio $VERSION. Installed apps update themselves on launch; for a fresh machine download **AcePolicyStudio-Setup.exe** below (SmartScreen: More info → Run anyway, once)." \
              --target "$GITHUB_SHA" || true
            npx electron-builder --win --publish always
            # Keep this release pinned as the repo's 'latest' (other apps
            # also publish releases in this repo).
            gh release edit "v$VERSION" --latest || true
            # Sweep any incomplete duplicate v* releases (no latest.yml =
            # not a real release of ours).
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select((.tag_name|test("^v[0-9]")) and ((.assets|map(.name)|index("latest.yml")) == null)) | .id' |
            while read -r rid; do
              echo "Deleting incomplete duplicate release id=$rid"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$rid" || true
            done
            # Retire the legacy fixed-tag release so nobody downloads a stale build.
            gh release delete ace-policy-studio-windows --yes --cleanup-tag || true
          fi

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcePolicyStudio-windows
          path: ace-policy-studio/release/AcePolicyStudio-Setup.exe
          if-no-files-found: error

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: ace-policy-studio/test-results/
          if-no-files-found: ignore
