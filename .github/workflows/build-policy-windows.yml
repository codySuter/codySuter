name: Build Ace Policy Studio (Windows)

# Builds Ace Policy Studio into a portable Windows .exe on a real Windows
# runner — after running the renderer E2E suite and an Electron smoke test
# (library seeding + a production printToPDF) — and publishes it as both a
# workflow artifact and a stable GitHub Release download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ace-policy-studio/**"
      - ".github/workflows/build-policy-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ace-policy-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ace-policy-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Renderer E2E (Playwright)
        run: |
          npx playwright install chromium
          npx playwright test tests/app.spec.ts

      - name: Electron smoke test (seeding + printToPDF)
        run: node scripts/electron-smoke.mjs

      # Publishes a versioned release (tag v<version>) with the one-click
      # installer + latest.yml so installed apps auto-update on launch.
      # If the version tag already exists, the build still runs as a check
      # but nothing is published — bump "version" in package.json to ship.
      - name: Package & publish installer (auto-update feed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists — packaging without publishing. Bump ace-policy-studio/package.json version to ship an update."
            npx electron-builder --win --publish never
          else
            npx electron-builder --win --publish always
            # Retire the legacy fixed-tag release so nobody downloads a stale build.
            gh release delete ace-policy-studio-windows --yes --cleanup-tag || true
          fi

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcePolicyStudio-windows
          path: ace-policy-studio/release/AcePolicyStudio-Setup.exe
          if-no-files-found: error

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: ace-policy-studio/test-results/
          if-no-files-found: ignore
