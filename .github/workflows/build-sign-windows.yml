name: Build Ace Sign Studio (Windows)

# Cross-compiles Ace Sign Studio into a standalone Windows .exe — after
# gofmt/vet, the Go test suite, and the Playwright E2E suite (which drives
# the real binary against a mock acehardware.com) — and publishes it as
# both a workflow artifact and a stable GitHub Release download.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ace-sign-studio/**"
      - ".github/workflows/build-sign-windows.yml"
  push:
    branches: [main]
    paths:
      - "ace-sign-studio/**"
      - ".github/workflows/build-sign-windows.yml"

permissions:
  contents: write

# One release publish at a time — overlapping runs would race the
# delete-then-create of the stable release tag.
concurrency:
  group: build-sign-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace-sign-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ace-sign-studio/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: E2E suite (real binary + mock acehardware.com)
        run: |
          cd e2e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node run.mjs

      # The suite above runs with ACE_LOOKUP_MODE=http, so it never touches
      # the browser lookup path that real lookups use. 2.4.0 shipped with
      # that path silently timing out on every lookup — results stayed
      # correct (the fallback answered) so nothing failed, they were just
      # ~17s each. This suite drives the browser path against a mock with
      # bot protection and fails if lookups stop using the warm session tab.
      - name: Browser lookup suite (warm-session fast path)
        run: |
          cd e2e
          CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" \
            node browser-lookup.mjs

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ace-sign-studio/e2e/screenshots/
          if-no-files-found: ignore

      - name: Build Windows EXE
        # ACE_SYNC_TOKEN (repo secret) is baked into the exe so store PCs
        # sync with zero per-machine setup; when absent (e.g. fork PRs)
        # the build still works and sync falls back to a pasted token.
        env:
          ACE_SYNC_TOKEN: ${{ secrets.ACE_SYNC_TOKEN }}
        run: ./build.sh

      - name: Upload EXE as a workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AceSignStudio-windows
          path: |
            dist/AceSignStudio.exe
            dist/version.json
          if-no-files-found: error

      - name: Validate the update manifest
        if: github.event_name != 'pull_request'
        # Installed copies parse this file to self-update; publishing a
        # syntactically broken one kills self-update fleet-wide with a
        # green build. Fail here instead.
        run: jq -e .version ../dist/version.json

      - name: Publish EXE + update manifest to a Release (stable download link)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update the existing release in place with --clobber instead of
          # delete-then-recreate: the old dance left a window (seconds per
          # push — indefinite if the re-create failed) where the download
          # URL and the self-update manifest 404'd for every installed copy.
          # The release is created without assets only if it doesn't exist
          # yet — passing assets to `gh release create` goes through a
          # hidden draft phase that once stranded the release as an unlisted
          # draft with a dead download URL. Stale drafts from such past
          # failures don't match the tag lookup, so sweep them by name.
          gh api repos/${GITHUB_REPOSITORY}/releases --paginate \
            --jq '.[] | select(.draft and .tag_name == "ace-sign-studio-windows") | .id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"; done
          if ! gh release view ace-sign-studio-windows >/dev/null 2>&1; then
            gh release create ace-sign-studio-windows \
              --title "Ace Sign Studio for Windows" \
              --notes "Latest Windows build. Download **AceSignStudio.exe** below and double-click to run (Windows 10/11, portable — no install). Windows SmartScreen may warn about an unrecognized app the first time — click **More info → Run anyway**. Installed copies self-update from this release via version.json." \
              --target "$GITHUB_SHA"
          fi
          # Exe first, manifest second: the manifest must never advertise a
          # build whose exe isn't uploaded yet. A client updating in the
          # brief exe-swap window gets a checksum mismatch (a clean, retried
          # error) rather than installing a torn download.
          gh release upload ace-sign-studio-windows ../dist/AceSignStudio.exe --clobber
          gh release upload ace-sign-studio-windows ../dist/version.json --clobber
          # Keep the release's tag pointing at the commit that built it.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/ace-sign-studio-windows" \
            -f sha="$GITHUB_SHA" -F force=true || true
