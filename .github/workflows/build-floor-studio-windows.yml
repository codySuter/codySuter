name: Build Ace Floor Studio (Windows)

# Builds Ace Floor Studio into a portable Windows .exe on a real Windows
# runner — after running the renderer E2E suite and an Electron smoke test
# (plan seeding + a JSON persistence round-trip) — and publishes it as
# both a workflow artifact and a stable GitHub Release download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ace-floor-studio/**"
      - ".github/workflows/build-floor-studio-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ace-floor-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ace-floor-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      - name: Renderer E2E (Playwright)
        run: |
          npx playwright install chromium
          npx playwright test tests/app.spec.ts

      - name: Electron smoke test (seeding + persistence round-trip)
        run: node scripts/electron-smoke.mjs

      - name: Package portable EXE
        run: npx electron-builder --win portable

      # The app's startup update check reads this file from the release.
      - name: Stamp version file for the update check
        shell: bash
        run: node -p "require('./package.json').version" > release/version.txt

      - name: Upload EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceFloorStudio-windows
          path: ace-floor-studio/release/AceFloorStudio.exe
          if-no-files-found: error

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: ace-floor-studio/test-results/
          if-no-files-found: ignore

      - name: Publish EXE to a Release (stable download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assetless create publishes immediately (no stuck-draft failure
          # mode); assets are uploaded to the live release. See the note in
          # build-sign-windows.yml.
          gh release delete ace-floor-studio-windows --yes --cleanup-tag || true
          gh api repos/${GITHUB_REPOSITORY}/releases --paginate \
            --jq '.[] | select(.draft and .tag_name == "ace-floor-studio-windows") | .id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"; done
          gh release create ace-floor-studio-windows \
            --title "Ace Floor Studio for Windows" \
            --notes "Latest Windows build. Download **AceFloorStudio.exe** below and double-click to run (Windows 10/11, portable — no install). Windows SmartScreen may warn about an unrecognized app the first time — click **More info → Run anyway**." \
            --target "$GITHUB_SHA"
          gh release upload ace-floor-studio-windows release/AceFloorStudio.exe release/version.txt
