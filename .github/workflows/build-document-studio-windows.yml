name: Build Ace Document Studio (Windows)

# Builds Ace Document Studio for Windows on a real Windows runner — after
# running the renderer E2E suite and an Electron smoke test (library
# seeding + a production printToPDF) — and publishes an NSIS installer
# (auto-updating via electron-updater + latest.yml) plus the classic
# portable .exe as both workflow artifacts and stable GitHub Release
# downloads.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ace-document-studio/**"
      - ".github/workflows/build-document-studio-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ace-document-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ace-document-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Sync merge-semantics unit tests
        run: npm run test:merge

      - name: Renderer E2E (Playwright)
        run: |
          npx playwright install chromium
          npx playwright test tests/app.spec.ts tests/features.spec.ts

      - name: Electron smoke test (seeding + printToPDF)
        run: node scripts/electron-smoke.mjs

      # Release builds carry the store's sync token (like Ace Sign Studio):
      # the ACE_DOC_SYNC_TOKEN repo secret is written into the packaged app
      # so the registers can leave the token box blank. Local builds go
      # without — the file is gitignored and never committed.
      - name: Bake the store sync token into the build
        shell: bash
        env:
          ACE_DOC_SYNC_TOKEN: ${{ secrets.ACE_DOC_SYNC_TOKEN }}
        run: |
          if [ -n "$ACE_DOC_SYNC_TOKEN" ]; then
            node -e "require('fs').writeFileSync('electron/builtin-sync.json', JSON.stringify({ repo: 'codysuter/ace-document-sync', token: process.env.ACE_DOC_SYNC_TOKEN }))"
            echo "built-in sync token embedded"
          else
            echo "no ACE_DOC_SYNC_TOKEN secret - building without a built-in token"
          fi

      - name: Package installer + portable EXE
        run: npx electron-builder --win nsis portable --publish never

      # The portable build's startup update check reads this file from the
      # release; the installer updates itself via latest.yml instead.
      - name: Stamp version file for the update check
        shell: bash
        run: node -p "require('./package.json').version" > release/version.txt

      - name: Upload EXEs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceDocumentStudio-windows
          path: |
            ace-document-studio/release/AceDocumentStudio.exe
            ace-document-studio/release/AceDocumentStudio-Setup.exe
          if-no-files-found: error

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: ace-document-studio/test-results/
          if-no-files-found: ignore

      - name: Publish EXE to a Release (stable download link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assetless create publishes immediately (no stuck-draft failure
          # mode); assets are uploaded to the live release. See the note in
          # build-sign-windows.yml.
          gh release delete ace-document-studio-windows --yes --cleanup-tag || true
          gh api repos/${GITHUB_REPOSITORY}/releases --paginate \
            --jq '.[] | select(.draft and .tag_name == "ace-document-studio-windows") | .id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"; done
          gh release create ace-document-studio-windows \
            --title "Ace Document Studio for Windows" \
            --notes "Latest Windows build. **AceDocumentStudio-Setup.exe** installs the app and keeps it updated automatically (recommended). **AceDocumentStudio.exe** is the classic portable build — no install, manual updates. Windows SmartScreen may warn about an unrecognized app the first time — click **More info → Run anyway**." \
            --target "$GITHUB_SHA"
          gh release upload ace-document-studio-windows \
            release/AceDocumentStudio.exe \
            release/AceDocumentStudio-Setup.exe \
            release/AceDocumentStudio-Setup.exe.blockmap \
            release/latest.yml \
            release/version.txt
